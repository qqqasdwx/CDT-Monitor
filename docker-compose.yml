services:
  cdt-monitor:
    build:
      context: .
    image: cdt-monitor:local
    restart: unless-stopped
    ports:
      - "${CDTM_BIND_ADDRESS:-127.0.0.1}:${CDTM_PUBLIC_PORT:-8080}:8080"
    environment:
      CDTM_ADMIN_PASSWORD: "${CDTM_ADMIN_PASSWORD:?CDTM_ADMIN_PASSWORD is required}"
      CDTM_ALIYUN_MODE: "${CDTM_ALIYUN_MODE:-dry-run}"
      CDTM_ALIYUN_CONNECT_TIMEOUT: "${CDTM_ALIYUN_CONNECT_TIMEOUT:-5s}"
      CDTM_ALIYUN_READ_TIMEOUT: "${CDTM_ALIYUN_READ_TIMEOUT:-10s}"
      CDTM_SESSION_TTL: "${CDTM_SESSION_TTL:-12h}"
      CDTM_SECURE_SESSION_COOKIE: "${CDTM_SECURE_SESSION_COOKIE:-true}"
      CDTM_LOGIN_MAX_FAILURES: "${CDTM_LOGIN_MAX_FAILURES:-5}"
      CDTM_LOGIN_WINDOW: "${CDTM_LOGIN_WINDOW:-15m}"
      CDTM_LOGIN_LOCKOUT: "${CDTM_LOGIN_LOCKOUT:-15m}"
      CDTM_TRUST_PROXY_HEADERS: "${CDTM_TRUST_PROXY_HEADERS:-false}"
      CDTM_SYNC_INTERVAL: "${CDTM_SYNC_INTERVAL:-5m}"
      CDTM_KEEPALIVE_INTERVAL: "${CDTM_KEEPALIVE_INTERVAL:-10m}"
      CDTM_LOG_LEVEL: "${CDTM_LOG_LEVEL:-info}"
    volumes:
      - cdt-monitor-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  cdt-monitor-data:
